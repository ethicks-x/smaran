# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  TMUX_SESSION: "smaran-dev"

tasks:
  setup:
    desc: Installs required packages for the project
    cmds:
      - bun install 
      - uv --project apps/api sync

  dev:all:
    desc: Start all development servers in a termux server
    cmds: 
      - tmux kill-session -t {{.TMUX_SESSION}} 2>/dev/null || true
      - tmux new-session -d -s {{.TMUX_SESSION}} -n 'API'
      - tmux set-window-option -g remain-on-exit on
      - tmux send-keys -t {{.TMUX_SESSION}}:API "clear" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:API "task dev:api" C-m
      - tmux new-window -t {{.TMUX_SESSION}} -n 'Web'
      - tmux send-keys -t {{.TMUX_SESSION}}:Web "clear" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:Web "task dev:web" C-m
      - tmux new-window -t {{.TMUX_SESSION}} -n 'Mobile'
      - tmux send-keys -t {{.TMUX_SESSION}}:Mobile "clear" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:Mobile "task dev:mobile" C-m
      - tmux attach-session -t {{.TMUX_SESSION}}

  dev:split:
    desc: Start all servers side-by-side in a split 3-pane dashboard
    cmds:
      - tmux kill-session -t {{.TMUX_SESSION}} 2>/dev/null || true
      - tmux new-session -d -s {{.TMUX_SESSION}} -n 'Dashboard'
      - tmux set-window-option -g remain-on-exit on
      - tmux split-window -h -t {{.TMUX_SESSION}}:1
      - tmux split-window -v -t {{.TMUX_SESSION}}:1.1
      - tmux select-layout -t {{.TMUX_SESSION}}:1 tiled
      - tmux send-keys -t {{.TMUX_SESSION}}:1.1 "clear" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:1.1 "task dev:api" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:1.2 "clear" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:1.2 "task dev:web" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:1.3 "clear" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:1.3 "task dev:mobile" C-m
      - tmux attach-session -t {{.TMUX_SESSION}}

  dev:web+api:
    desc: Start the API and web servers side-by-side in a split 2-pane dashboard
    cmds:
      - tmux kill-session -t {{.TMUX_SESSION}} 2>/dev/null || true
      - tmux new-session -d -s {{.TMUX_SESSION}} -n 'Web+API'
      - tmux set-window-option -g remain-on-exit on
      - tmux split-window -v -t {{.TMUX_SESSION}}:1
      - tmux select-layout -t {{.TMUX_SESSION}}:1 tiled
      - tmux send-keys -t {{.TMUX_SESSION}}:1.1 "clear" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:1.1 "task dev:api" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:1.2 "clear" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:1.2 "task dev:web" C-m
      - tmux attach-session -t {{.TMUX_SESSION}}

  dev:mobile+api:
    desc: Start the API and mobile servers side-by-side in a split 2-pane dashboard
    cmds:
      - tmux kill-session -t {{.TMUX_SESSION}} 2>/dev/null || true
      - tmux new-session -d -s {{.TMUX_SESSION}} -n 'Mobile+API'
      - tmux set-window-option -g remain-on-exit on
      - tmux split-window -v -t {{.TMUX_SESSION}}:1
      - tmux select-layout -t {{.TMUX_SESSION}}:1 tiled
      - tmux send-keys -t {{.TMUX_SESSION}}:1.1 "clear" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:1.1 "task dev:api" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:1.2 "clear" C-m
      - tmux send-keys -t {{.TMUX_SESSION}}:1.2 "task dev:mobile" C-m
      - tmux attach-session -t {{.TMUX_SESSION}}

  stop:
    desc: Stop all development servers and kill the tmux session
    cmds:
      - tmux kill-session -t {{.TMUX_SESSION}}

  db:migrate:
    desc: Apply every pending migration to the database in apps/api/.env
    dir: apps/api
    cmds:
      - uv run alembic upgrade head

  db:current:
    desc: Show which migration the database is currently at
    dir: apps/api
    cmds:
      - uv run alembic current --verbose

  db:history:
    desc: List every migration, newest first
    dir: apps/api
    cmds:
      - uv run alembic history --indicate-current

  db:revision:
    desc: 'Autogenerate a migration from model changes. Usage: task db:revision -- "add x"'
    dir: apps/api
    cmds:
      # Autogenerate compares the models to the live database, so it needs a database that
      # is already at head — otherwise it writes the drift it finds into your new revision.
      - uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  db:downgrade:
    desc: Step the database back one migration
    dir: apps/api
    cmds:
      - uv run alembic downgrade -1

  db:stamp:
    desc: 'Record a revision as applied WITHOUT running it. Usage: task db:stamp -- head'
    dir: apps/api
    cmds:
      - uv run alembic stamp {{.CLI_ARGS}}

  dev:api:
    desc: Start the API server
    dir: apps/api
    cmds:
      - echo "Starting development API server..."
      - uv run src/main.py
    silent: true

  dev:web:
    desc: Start the Caregiver Dashboard web server
    dir: apps/web
    cmds:
      - echo "Starting development web server..."
      - bun run dev
    silent: true

  dev:mobile:
    desc: Start the Smaran mobile app server
    dir: apps/mobile
    cmds:
      - echo "Starting development mobile server..."
      - bun run start
    silent: true
