# Alembic owns this database's schema. `create_all` does not — see `alembic/env.py`.
#
# The connection URL is deliberately absent: it is a secret and lives in `.env`
# (`AGENTS.md` §2.5). `env.py` reads it from `core.config.settings` so there is exactly one
# place a database URL is configured, and none of them is a file in git.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# Filenames sort in creation order, which is the order they are applied in, so `ls` and
# `alembic history` agree.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
